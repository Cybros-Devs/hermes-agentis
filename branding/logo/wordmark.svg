<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-labelledby="wm-t wm-d">
  <title id="wm-t">Voxcell wordmark</title>
  <desc id="wm-d">Braille V monogram (dots 1, 2, 3, 6) in a bordered panel beside a monospace VOXCELL lockup with an emerald prompt cursor.</desc>
  <!-- hard offset shadow (no blur, ever) -->
  <rect x="28" y="34" width="92" height="92" rx="10" fill="#000000"/>
  <!-- panel -->
  <rect x="22" y="28" width="92" height="92" rx="10" fill="#0A1410" stroke="#ECF3F0" stroke-width="1.5"/>
  <!-- Braille cell, 2x3. V = dots 1 (top-left), 2 (mid-left), 3 (bottom-left), 6 (mid-right) -->
  <g>
    <circle cx="55" cy="48"  r="5.5" fill="#A7F3D0"/>
    <circle cx="55" cy="74"  r="5.5" fill="#A7F3D0"/>
    <circle cx="55" cy="100" r="5.5" fill="#A7F3D0"/>
    <circle cx="81" cy="48"  r="5.5" fill="#2A3A30"/>
    <circle cx="81" cy="74"  r="5.5" fill="#A7F3D0"/>
    <circle cx="81" cy="100" r="5.5" fill="#2A3A30"/>
  </g>
  <!-- monospace terminal lockup -->
  <text x="140" y="80" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="30" font-weight="600" fill="#ECF3F0" textLength="168" lengthAdjust="spacing" letter-spacing="0.5">VOXCELL</text>
  <text x="140" y="110" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="19" font-weight="500" textLength="190" lengthAdjust="spacing"><tspan fill="#A7F3D0">//</tspan><tspan fill="#8FA399"> FOR HERMES DUET</tspan></text>
  <!-- emerald prompt cursor (live state) -->
  <rect x="318" y="60" width="11" height="24" fill="#34D399"/>
  <!-- halftone hint -->
  <g fill="#1E2B24">
    <circle cx="596" cy="34"  r="1.6"/><circle cx="586" cy="44"  r="1.6"/>
    <circle cx="596" cy="54"  r="1.6"/><circle cx="586" cy="64"  r="1.6"/>
    <circle cx="596" cy="74"  r="1.6"/><circle cx="586" cy="84"  r="1.6"/>
    <circle cx="596" cy="94"  r="1.6"/><circle cx="586" cy="104" r="1.6"/>
    <circle cx="596" cy="114" r="1.6"/>
  </g>
</svg>
