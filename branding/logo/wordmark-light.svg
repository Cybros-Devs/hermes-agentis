<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-labelledby="wml-t wml-d">
  <title id="wml-t">Voxcell wordmark — light variant</title>
  <desc id="wml-d">Braille V monogram in an off-white panel beside a charcoal monospace VOXCELL lockup with a deep emerald prompt cursor.</desc>
  <!-- hard offset shadow, light mode: darker paper, still no blur -->
  <rect x="28" y="34" width="92" height="92" rx="10" fill="#CFE5DA"/>
  <!-- panel -->
  <rect x="22" y="28" width="92" height="92" rx="10" fill="#F2F7F4" stroke="#0A1410" stroke-width="1.5"/>
  <!-- Braille cell, 2x3. V = dots 1, 2, 3, 6. Gold reads bronze on light. -->
  <g>
    <circle cx="55" cy="48"  r="5.5" fill="#059669"/>
    <circle cx="55" cy="74"  r="5.5" fill="#059669"/>
    <circle cx="55" cy="100" r="5.5" fill="#059669"/>
    <circle cx="81" cy="48"  r="5.5" fill="#D7E4DC"/>
    <circle cx="81" cy="74"  r="5.5" fill="#059669"/>
    <circle cx="81" cy="100" r="5.5" fill="#D7E4DC"/>
  </g>
  <!-- monospace terminal lockup -->
  <text x="140" y="80" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="30" font-weight="600" fill="#0A1410" textLength="168" lengthAdjust="spacing" letter-spacing="0.5">VOXCELL</text>
  <text x="140" y="110" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="19" font-weight="500" textLength="190" lengthAdjust="spacing"><tspan fill="#059669">//</tspan><tspan fill="#5C6E64"> FOR HERMES DUET</tspan></text>
  <!-- emerald prompt cursor, darkened for light-field contrast -->
  <rect x="318" y="60" width="11" height="24" fill="#059669"/>
  <!-- halftone hint -->
  <g fill="#C8D8CE">
    <circle cx="596" cy="34"  r="1.6"/><circle cx="586" cy="44"  r="1.6"/>
    <circle cx="596" cy="54"  r="1.6"/><circle cx="586" cy="64"  r="1.6"/>
    <circle cx="596" cy="74"  r="1.6"/><circle cx="586" cy="84"  r="1.6"/>
    <circle cx="596" cy="94"  r="1.6"/><circle cx="586" cy="104" r="1.6"/>
    <circle cx="596" cy="114" r="1.6"/>
  </g>
</svg>
