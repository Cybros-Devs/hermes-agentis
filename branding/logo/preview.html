<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxcell logo preview</title>
<style>
  body { background:#0e0e0e; color:#f3eee3; font-family:'JetBrains Mono',Menlo,Consolas,monospace; margin:0; padding:24px; }
  h1 { font-size:16px; letter-spacing:.08em; }
  h2 { font-size:12px; color:#b9b2a3; letter-spacing:.08em; margin:28px 0 8px; border-bottom:1.5px solid #2a2a2a; padding-bottom:4px; }
  .row { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .light { background:#f3eee3; padding:16px; border-radius:8px; }
  .size { font-size:11px; color:#b9b2a3; margin-top:4px; }
</style>
</head>
<body>
  <h1>VOXCELL — logo preview</h1>

  <h2>DARK (primary)</h2>
  <div class="row">
    <div><img src="wordmark.svg" width="480" alt="wordmark 480"><div class="size">480px</div></div>
    <div><img src="wordmark.svg" width="320" alt="wordmark 320"><div class="size">320px</div></div>
    <div><img src="wordmark.svg" width="200" alt="wordmark 200"><div class="size">200px</div></div>
  </div>

  <h2>LIGHT</h2>
  <div class="light row">
    <div><img src="wordmark-light.svg" width="480" alt="wordmark light 480"><div class="size">480px</div></div>
    <div><img src="wordmark-light.svg" width="200" alt="wordmark light 200"><div class="size">200px</div></div>
  </div>

  <h2>SCALE CHECK (min panel 24px)</h2>
  <div class="row">
    <div><img src="wordmark.svg" width="120" alt="wordmark 120"><div class="size">120px</div></div>
    <div><img src="wordmark.svg" width="80" alt="wordmark 80"><div class="size">80px — cursor still legible</div></div>
  </div>
</body>
</html>
